<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LORD ANIME — عالم الأنمي الحر</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="logo">⚡ LORD <span>ANIME</span></div>
        <nav>
            <button class="dev-btn" onclick="showDev()">👤 المطور</button>
        </nav>
    </header>

    <main>
        <h2 class="section-title">آخر الحلقات المضافة</h2>
        
        <div class="anime-grid">
            <div class="anime-card">
                <div class="badge">HD</div>
                <img src="https://via.placeholder.com/200x300?text=One+Piece" alt="One Piece">
                <div class="info">
                    <h3>ون بيس - 1100</h3>
                    <button class="dl-btn">تحميل / مشاهدة</button>
                </div>
            </div>

            <div class="anime-card">
                <div class="badge">New</div>
                <img src="https://via.placeholder.com/200x300?text=Solo+Leveling" alt="Solo Leveling">
                <div class="info">
                    <h3>سولو ليفيلنج - 12</h3>
                    <button class="dl-btn">تحميل / مشاهدة</button>
                </div>
            </div>

            </div>
    </main>

    <div id="devModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeDev()">&times;</span>
            <h2>سيرة المطور الذاتية 👑</h2>
            <hr>
            <p><strong>الاسم:</strong> Abdullah (LORD)</p>
            <p><strong>العمر:</strong> 19 سنة</p>
            <p><strong>التخصص:</strong> مطور أنظمة و Bot Architect</p>
            <p>مطور محترف في Node.js، أسعى دائماً لتقديم الأفضل في عالم البرمجة.</p>
        </div>
    </div>

    <script>
        function showDev() { document.getElementById('devModal').style.display = 'flex'; }
        function closeDev() { document.getElementById('devModal').style.display = 'none'; }
    </script>
</body>
</html>
